<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Schwab-py-NG</title>
  <desc id="desc">A modern banner for the hardened Python client for the Charles Schwab API</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0b2440"/>
      <stop offset="1" stop-color="#103d57"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="930" cy="125" r="260" fill="url(#glow)"/>
  <circle cx="170" cy="330" r="210" fill="url(#glow)" opacity="0.55"/>

  <g opacity="0.42" fill="none" stroke-linecap="round">
    <path d="M0 285C105 265 166 306 260 260S426 176 532 206 687 302 790 244 959 109 1200 138" stroke="#2dd4bf" stroke-width="3"/>
    <path d="M0 308C114 278 198 330 305 286S476 204 586 232 737 307 844 266 1018 176 1200 192" stroke="#38bdf8" stroke-width="2" opacity="0.65"/>
  </g>

  <g transform="translate(88 72)" filter="url(#soft-shadow)">
    <rect width="112" height="112" rx="26" fill="#0f2944" stroke="#38bdf8" stroke-opacity="0.55"/>
    <path d="M30 74V43l25-14 27 15v31L56 90 30 74Z" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M42 65 54 52l10 9 16-20" fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="80" cy="41" r="4" fill="#2dd4bf"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="232" y="116" fill="#f8fafc" font-size="58" font-weight="750" letter-spacing="-1.5">Schwab-py-NG</text>
    <rect x="665" y="72" width="66" height="30" rx="15" fill="#2dd4bf" fill-opacity="0.14" stroke="#2dd4bf" stroke-opacity="0.65"/>
    <text x="698" y="93" fill="#5eead4" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1.5">5.2.0</text>
    <text x="234" y="157" fill="#bae6fd" font-size="23" font-weight="500">Hardened Python access to the Charles Schwab API</text>
    <text x="234" y="191" fill="#94a3b8" font-size="17">Auth · Market data · Streaming · Orders · Accounts</text>
  </g>

  <g transform="translate(792 62)" filter="url(#soft-shadow)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect width="322" height="170" rx="22" fill="#081a2e" fill-opacity="0.88" stroke="#7dd3fc" stroke-opacity="0.22"/>
    <circle cx="27" cy="25" r="5" fill="#fb7185"/>
    <circle cx="45" cy="25" r="5" fill="#fbbf24"/>
    <circle cx="63" cy="25" r="5" fill="#34d399"/>
    <text x="24" y="58" fill="#64748b" font-size="13">$</text>
    <text x="41" y="58" fill="#e2e8f0" font-size="11">pip uninstall -y schwab-py</text>
    <text x="24" y="80" fill="#64748b" font-size="13">$</text>
    <text x="41" y="80" fill="#e2e8f0" font-size="10">pip install git+https://github.com/neusse/Schwab-py-NG</text>
    <text x="24" y="112" fill="#7dd3fc" font-size="14">from</text>
    <text x="62" y="112" fill="#e2e8f0" font-size="14">schwab.auth</text>
    <text x="154" y="112" fill="#7dd3fc" font-size="14">import</text>
    <text x="204" y="112" fill="#e2e8f0" font-size="14">easy_client</text>
    <path d="M25 141h180" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="223" cy="141" r="5" fill="#2dd4bf"/>
    <circle cx="250" cy="141" r="5" fill="#38bdf8"/>
    <circle cx="277" cy="141" r="5" fill="#818cf8"/>
  </g>

  <g transform="translate(88 284)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="650">
    <g>
      <rect width="142" height="36" rx="18" fill="#0f2944" stroke="#38bdf8" stroke-opacity="0.38"/>
      <circle cx="21" cy="18" r="5" fill="#38bdf8"/>
      <text x="35" y="23" fill="#dbeafe">Python 3.10–3.14</text>
    </g>
    <g transform="translate(154)">
      <rect width="142" height="36" rx="18" fill="#0f2944" stroke="#2dd4bf" stroke-opacity="0.38"/>
      <circle cx="21" cy="18" r="5" fill="#2dd4bf"/>
      <text x="35" y="23" fill="#ccfbf1">Windows + Linux</text>
    </g>
    <g transform="translate(308)">
      <rect width="106" height="36" rx="18" fill="#0f2944" stroke="#a5b4fc" stroke-opacity="0.38"/>
      <circle cx="21" cy="18" r="5" fill="#a5b4fc"/>
      <text x="35" y="23" fill="#e0e7ff">MIT License</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="27" fill="none" stroke="#7dd3fc" stroke-opacity="0.16" stroke-width="2"/>
</svg>
